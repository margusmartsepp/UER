[project]
name = "uer"
version = "0.1.0"
description = "UER - Universal Expert Registry: Manipulation detection for AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Margus Martsepp" },
    { name = "Marco Lackovic" },
    { name = "Martin Martsepp" },
    { name = "Zane Estere" },
    { name = "Anirudh" },
]

dependencies = [
    "litellm>=1.40.0",
    "datasets>=2.18.0",
    "huggingface-hub>=0.20.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.1",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uer"]

[tool.black]
line-length = 100
target-version = ['py311']
skip-string-normalization = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["S101"]  # Allow assert statements in tests
"context/scripts/*.py" = ["E501"]  # Allow long lines in test scripts
"seed_datasets.py" = ["E501"]  # Allow long lines in setup script
"src/uer/models/*.py" = ["E501", "N805"]  # Allow long lines in descriptions, Pydantic validators use cls
"src/uer/server.py" = ["E501"]  # Allow long lines in tool descriptions

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "datasets.*",
    "huggingface_hub.*",
    "litellm.*",
    "mcp.*",
    "pydantic.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "seed_datasets",
    "context.scripts.*",
]
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "context/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
