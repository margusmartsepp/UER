version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: uer-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

# To start MinIO:
#   docker-compose up -d
#
# To access MinIO Console:
#   http://localhost:9001
#   Username: minioadmin
#   Password: minioadmin
#
# To stop MinIO:
#   docker-compose down
#
# To remove data:
#   docker-compose down -v
#   rm -rf data/minio
